---
- name: Operational Excellence - Integrated Platform Sizing & Verification Framework
  hosts: localhost
  gather_facts: false
  vars:
    target_mesh: "platform-simulation-vpc"
    kuma_api_port: 5681
    expected_containers:
      - { name: "eccs-compute-nodes", service: "eccs-compute-svc" }
      - { name: "calbs-cagis-ingress", service: "ingress-gateway-svc" }
      - { name: "mkrs-k8s-workload", service: "mkrs-workload-svc" }

  tasks:
    - name: 🔍 Audit Active Container Execution Boundaries
      community.docker.docker_container_info:
        name: "{{ item.name }}"
      register: container_facts
      loop: "{{ expected_containers }}"

    - name: 🛡️ Assert Topology Health and Runtime Invariants
      ansible.builtin.assert:
        that:
          - item.container.State.Running == true
          - item.container.State.Paused == false
        fail_msg: "Fatal: Container boundary {{ item.item.name }} is missing or unhealthy!"
        success_msg: "Success: Verified execution bounds for {{ item.item.name }}."
      loop: "{{ container_facts.results }}"

    - name: 🌐 Query Kuma SDN Control Plane Multi-Mesh Fabric Status
      ansible.builtin.uri:
        url: "http://localhost:{{ kuma_api_port }}/meshes/{{ target_mesh }}"
        method: GET
        status_code: 200
      register: sdn_status
      ignore_errors: true

    - name: 📊 Evaluate Network Isolation Integrity
      ansible.builtin.assert:
        that:
          - sdn_status.status == 200
        fail_msg: "Fatal: Zero-Trust Kuma SDN Control Plane API or VPC Mesh is unreachable!"
        success_msg: "Success: Multi-tenant isolated Virtual VPC Mesh detected and active."
